name: ci

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main, "emcom/**"]
    paths:
      - 'src-tauri/**'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/**'
      - 'rust-toolchain.toml'
      - 'frontend/**'
  pull_request:
    paths:
      - 'src-tauri/**'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/**'
      - 'rust-toolchain.toml'
      - 'frontend/**'

permissions:
  contents: read

# Keep the `checks-` prefix. When `release` calls this workflow the github
# context is the caller's, so `github.workflow` reads `release` -- without the
# prefix these checks share the release run's group and cancel it.
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        # macos-latest selects the ARM hosted pool, which has stalled before
        # checkout (actions/runner#4833). Use the standard Intel pool at our
        # macOS 15 support floor, and cross-check ARM compilation below.
        os: [ubuntu-24.04, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Only what the runner image lacks. build-essential, libssl-dev, patchelf
      # and file all ship on ubuntu-24.04 already; listing them just invites apt
      # to spend time upgrading them. If a future runner image drops one, the
      # build breaks here rather than silently -- add it back at that point.
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev

      # No version here on purpose. rust-toolchain.toml at the repo root names
      # it, along with the components, so this job, the release matrix and a
      # local build cannot drift apart. rustup downloads it if the runner image
      # ships something else.
      - name: Install Rust toolchain
        run: rustup toolchain install

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: './src-tauri -> target'

      - name: Format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Clippy
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: Test
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Check Apple Silicon compilation
        if: runner.os == 'macOS'
        run: |
          rustup target add aarch64-apple-darwin
          cargo check --locked --manifest-path src-tauri/Cargo.toml --target aarch64-apple-darwin

      # chat.js has no build step, so nothing else would catch a syntax error
      # before it reaches the page. Only node itself is needed for that, hence
      # no install: there is nothing in node_modules this job uses.
      - name: Install Node
        uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3
        with:
          runtime: node@24
          install: false

      - name: Check injected script parses
        run: node --check src-tauri/src/inject/chat.js

      - name: Check injected script behaves
        run: node scripts/chatjs-test.js

  dependency-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install pinned Rust toolchain
        run: rustup toolchain install
      - name: Install RustSec auditor
        run: cargo install cargo-audit --version 0.23.0 --locked
      - name: Audit Rust lockfile
        run: cargo audit --file src-tauri/Cargo.lock
      - name: Install Node and pnpm
        uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3
        with:
          runtime: node@24
          install: false
      - name: Install locked build tools without package scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Audit JavaScript build tools
        run: pnpm audit --audit-level moderate
